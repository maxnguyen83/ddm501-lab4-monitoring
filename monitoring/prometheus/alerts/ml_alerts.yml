# Model-level alert rules (TASK 12).
#
# api_alerts.yml is the worked example, and every rule here follows the same
# four disciplines:
#   - an `expr` that means the same thing at 10 rps and at 1000 rps,
#   - a `for:` longer than one scrape, so a single bad sample cannot page you,
#   - a `severity` label ("wake someone" vs "look at it tomorrow"),
#   - a `summary` saying what is wrong and a `description` saying what to DO.
#
# These rules are different in kind from the ones in api_alerts.yml: none of
# them proves the model is wrong. Each is a reason to LOOK.
#
# `signal` says which family the alert belongs to, so a router can send
# leading-indicator alerts to the ML owners and service alerts to on-call:
#   leading    input drift: moves first, weeks before any accuracy number
#   output     what the model is deciding
#   fairness   who absorbs the decisions
#   service    the model call itself is failing or slow
#
# Behaviour is unit-tested before Prometheus ever loads these:
#     cd monitoring/prometheus/tests && promtool test rules alert_tests.yml ml_alert_tests.yml

groups:
  - name: ml_drift
    rules:
      # PSI 0.10 is the conventional "moderate" band. 15m because the PSI is
      # recomputed over a rolling window: a short burst of unusual traffic
      # moves it for a few scrapes and then washes out.
      - alert: ModerateFeatureDrift
        expr: ml_drift_score > 0.10
        for: 15m
        labels:
          severity: warning
          signal: leading
        annotations:
          summary: 'Input drift in the moderate band (PSI {{ $value | printf "%.3f" }})'
          description: >-
            The applicants arriving no longer match the training population.
            The model is not broken and its outputs are still well-formed;
            this is the earliest signal available, weeks before any accuracy
            number could arrive. Check ml_feature_drift_psi by feature to see
            which one moved, and whether it moved for a reason you already
            know about (a new marketing channel, a seasonal effect).

      # Same metric, the "act" band. ModerateFeatureDrift keeps firing above
      # 0.25 too; suppressing it is an Alertmanager inhibit rule, not a
      # narrower expression here.
      - alert: SignificantFeatureDrift
        expr: ml_drift_score > 0.25
        for: 15m
        labels:
          severity: critical
          signal: leading
        annotations:
          summary: 'Input drift is significant (PSI {{ $value | printf "%.3f" }})'
          description: >-
            Retraining is likely warranted. Before triggering it, confirm the
            drift is real and not an artefact: a single upstream system
            sending a default value for a field produces exactly this
            signature and is fixed in the pipeline, not in the model.

      # The service reports drift as 0.0 below 200 requests, because it is not
      # measuring. This rule makes "not measuring" visible on its own so that
      # silence from the two rules above is never read as "no drift".
      - alert: DriftWindowTooSmall
        expr: ml_drift_window_size < 200
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Drift window has fewer than 200 requests"
          description: >-
            Not a model problem — a statistics problem. The drift number
            reported below this size is noise, and the service reports it as
            insufficient rather than as zero. This alert exists so that
            "drift is fine" is never inferred from "drift is not being
            measured".

  - name: ml_behaviour
    rules:
      # DECLINE share as a ratio of rates over 30m. Baseline is about 8% on
      # training-like traffic; 20% is two and a half times that. A raw count
      # of declines would fire on a busy Monday and never on a quiet Sunday.
      - alert: DecisionMixShift
        expr: |
          sum(rate(ml_decisions_total{decision="DECLINE"}[30m]))
          /
          sum(rate(ml_decisions_total[30m]))
          > 0.20
        for: 30m
        labels:
          severity: warning
          signal: output
        annotations:
          summary: 'DECLINE share is {{ $value | humanizePercentage }} of decisions (baseline about 8%)'
          description: >-
            The model is declining a much larger share of applicants than it
            did on training-like traffic. This is the business-visible
            consequence and usually lags input drift: check
            ml_feature_drift_psi first. If drift is low, check whether a
            threshold or the model version changed (ml_model_info). Tell the
            underwriting team before the manual-review queue and complaints
            show it.

      # The gap between the most- and least-flagged group. Critical because
      # it has legal weight and neither the drift score nor the score
      # distribution will show it.
      - alert: FairnessGapWidened
        expr: ml_fairness_gap > 0.10
        for: 20m
        labels:
          severity: critical
          signal: fairness
        annotations:
          summary: 'Selection-rate gap between groups is {{ $value | printf "%.3f" }}'
          description: >-
            One group is being sent to review or decline at a materially
            different rate than another. Aggregate drift and aggregate score
            metrics can both look healthy while this fires — that is the
            point of measuring it separately. Confirm against
            ml_selection_rate by group before acting; a gap that reflects a
            real change in who is applying is a different problem from a gap
            the model introduced.

      # An absolute rate on purpose. The ratio version already exists:
      # HighErrorRate divides 5xx by all requests, and a failed model call
      # surfaces there as a 500. A ratio against ml_predictions_total would
      # go silent exactly when every call fails, because that labelled
      # counter has no series until the first success. 0.1/s (six failures a
      # minute, sustained) is also a floor that one stray error cannot cross.
      - alert: PredictionErrorsRising
        expr: sum(rate(ml_prediction_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          signal: service
        annotations:
          summary: 'Model calls are failing at {{ $value | printf "%.2f" }}/s'
          description: >-
            Failures inside the model call, not in HTTP routing. Group
            ml_prediction_errors_total by error_type: a ValueError or KeyError
            after a deploy usually means the request schema and the model's
            expected columns no longer agree; a MemoryError points at the
            container. Roll back to the last good model version if it started
            with a release.

      # SHAP costs far more than a prediction. Its own histogram means a slow
      # /explain cannot hide inside the prediction percentile.
      - alert: ExplanationLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(ml_explain_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          signal: service
        annotations:
          summary: 'p95 explanation latency is {{ $value | humanizeDuration }}'
          description: >-
            SHAP explanations are slower than one second at p95. Predictions
            are unaffected, but adverse-action notices and underwriter screens
            wait on this. Check whether explanation volume rose
            (ml_explanations_total), whether the model grew (more trees means
            slower TreeExplainer), and the host CPU on the Service Health
            dashboard before scaling.
